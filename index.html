<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>

Quiz Dashboard

</title>

<style>

*{

box-sizing:border-box;

}

body{

margin:0;

font-family:
Segoe UI,
Arial,
sans-serif;

background:#f4f6fb;

}

/* LAYOUT */

.wrapper{

display:flex;

min-height:100vh;

}

/* SIDEBAR */

.sidebar{

width:260px;

background:#4338ca;

padding:25px;

color:white;

box-shadow:
0 0 20px rgba(0,0,0,.1);

}

.logo{

font-size:28px;

font-weight:bold;

margin-bottom:40px;

}

.menu{

padding:15px;

margin-bottom:12px;

border-radius:12px;

cursor:pointer;

transition:.2s;

}

.menu:hover{

background:
rgba(255,255,255,.15);

}

.menu.active{

background:
rgba(255,255,255,.2);

}

/* CONTENT */

.content{

flex:1;

padding:35px;

overflow:auto;

}

.page{

display:none;

animation:
fade .25s ease;

}

.page.active{

display:block;

}

.card{

background:white;

padding:30px;

border-radius:20px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}

.quizFrame{

width:100%;

height:800px;

border:none;

border-radius:15px;

margin-top:20px;

background:white;

}

@keyframes fade{

from{

opacity:0;

transform:
translateY(10px);

}

to{

opacity:1;

transform:none;

}

}

/* MOBILE */

@media(max-width:800px){

.wrapper{

flex-direction:column;

}

.sidebar{

width:100%;

}

.content{

padding:20px;

}

.quizFrame{

height:90vh;

}

}

</style>

</head>

<body>


<div class="wrapper">


<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

QUIZ APP

</div>

<div
class="menu active"
onclick="showPage('home',this)"
>

🏠 Home

</div>

<div
class="menu"
onclick="showPage('quiz',this)"
>

📚 Quiz

</div>

<div
class="menu"
onclick="showPage('about',this)"
>

ℹ Tentang

</div>

<div
class="menu"
onclick="showPage('contact',this)"
>

📞 Kontak

</div>

</div>



<!-- CONTENT -->

<div class="content">


<!-- HOME -->

<section
class="page active"
id="home"
>

<div class="card">

<h1>

Selamat Datang

</h1>

<p>

Website quiz berbasis dashboard.

Gunakan sidebar di kiri untuk navigasi.

</p>

</div>

</section>



<!-- QUIZ -->

<section
class="page"
id="quiz"
>

<div class="card">

<h1>

Kuis Pancasila

</h1>

<p>

Silakan kerjakan quiz berikut.

</p>

<iframe

class="quizFrame"

src="https://script.google.com/macros/s/AKfycbymAyaQfmy3QmcFC6WeEBFVkrDCDdpsZyzy6Rxw-mcZ3mfIFSzBcUU1aXgk6dyRIvM4eQ/exec"

>

</iframe>

</div>

</section>



<!-- ABOUT -->

<section
class="page"
id="about"
>

<div class="card">

<h1>

Tentang

</h1>

<p>

Website dashboard sederhana yang menampilkan quiz online.

</p>

</div>

</section>



<!-- CONTACT -->

<section
class="page"
id="contact"
>

<div class="card">

<h1>

Kontak

</h1>

<p>

email@example.com

</p>

</div>

</section>



</div>

</div>



<script>

function showPage(id,el){

document
.querySelectorAll(".page")
.forEach(
x=>x.classList.remove("active")
)

document
.getElementById(id)
.classList.add("active")

document
.querySelectorAll(".menu")
.forEach(
x=>x.classList.remove("active")
)

el.classList.add("active")

}

</script>


</body>

</html>
